<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="416" viewBox="0 0 1280 416" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">Wenyi</title>
  <desc id="desc">Wenyi’s double speech bubble mark. Live transcription, bilingual captions, and local translation on Apple Silicon.</desc>
  <defs>
